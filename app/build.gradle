plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.screenrecorder.simple'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.screenrecorder.simple'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
